name: CI

on:
  push:
    branches: [master, webview2]
  pull_request:
    branches: [master, webview2]
  workflow_dispatch:
    inputs:
      publish:
        description: Create an immutable GitHub binary release
        required: true
        type: boolean
        default: false
      publish_npm:
        description: Also publish to npm after the GitHub release succeeds
        required: true
        type: boolean
        default: false
      npm_tag:
        description: npm distribution tag
        required: true
        type: string
        default: latest

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: windows-2022
            platform: win32-x64
          - os: macos-15-intel
            platform: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsecret-1-dev xvfb
      - name: Install Windows assembler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nasmDirectory = Join-Path $env:ProgramFiles 'NASM'
          if (!(Test-Path (Join-Path $nasmDirectory 'nasm.exe'))) {
            throw 'NASM installation did not provide nasm.exe'
          }
          $nasmDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: npm ci
      - run: npm run tsd -- --pretty false
      - run: npm run test:unit
      - name: Build
        shell: bash
        run: bash node/scripts/build.sh
      - name: Test Windows executable trust and bootstrap updates
        if: runner.os == 'Windows'
        env:
          DESKGAP_BOOTSTRAP_TEST_EXE: ${{ github.workspace }}/dist_build/Release/DeskGapBootstrap.exe
          DESKGAP_NATIVE_TEST_EXE: ${{ github.workspace }}/dist_build/Release/DeskGap/DeskGap.exe
        run: node --test node/test/unit/windows-executable-native.js node/test/unit/bootstrap-persistence.js
      - name: Test DeskGap
        if: runner.os != 'Linux'
        run: node node/test/start.js "${{ github.workspace }}/dist_build/dist"
      - name: Test DeskGap on Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node node/test/start.js "${{ github.workspace }}/dist_build/dist"
      - name: Test behavior fixtures
        if: runner.os != 'Linux'
        run: >-
          node node/test/run-fixtures.js "${{ github.workspace }}/dist_build/dist"
          invoke-behavior protocol-behavior channel-behavior menu-bar-behavior updater-behavior
      - name: Test behavior fixtures on Xvfb
        if: runner.os == 'Linux'
        run: >-
          xvfb-run --auto-servernum node node/test/run-fixtures.js "${{ github.workspace }}/dist_build/dist"
          invoke-behavior protocol-behavior channel-behavior menu-bar-behavior updater-behavior
      - name: Test WebView2 behavior fixtures
        if: runner.os == 'Windows'
        run: >-
          node node/test/run-fixtures.js "${{ github.workspace }}/dist_build/dist"
          navigation-lifecycle webcontents-policy session-behavior
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist_build/dist
          if-no-files-found: error

  package:
    name: Prepare npm package
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-x64'
          path: dists
      - run: bash node/scripts/prepare-npm.sh dists
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: npm.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: dist_zips
          if-no-files-found: error

  test-package:
    name: Test npm package (${{ matrix.platform }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: windows-2022
            platform: win32-x64
          - os: macos-15-intel
            platform: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Linux runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libsecret-1-0 xvfb
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist_zips
      - name: Test npm package
        if: runner.os != 'Linux'
        shell: bash
        env:
          DESKGAP_DIST_FOLDER: ${{ github.workspace }}/dist_zips
          DESKGAP_NPM_TEST_INSTALL_WHAT: ${{ github.workspace }}/artifacts/npm.tgz
          DESKGAP_NPM_TEST_VERSION_FILE: ${{ github.workspace }}/node/VERSION
        run: bash node/scripts/test-npm.sh
      - name: Test npm package on Xvfb
        if: runner.os == 'Linux'
        env:
          DESKGAP_DIST_FOLDER: ${{ github.workspace }}/dist_zips
          DESKGAP_NPM_TEST_INSTALL_WHAT: ${{ github.workspace }}/artifacts/npm.tgz
          DESKGAP_NPM_TEST_VERSION_FILE: ${{ github.workspace }}/node/VERSION
        run: xvfb-run --auto-servernum bash node/scripts/test-npm.sh

  publish:
    name: Publish GitHub binaries
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: test-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist_zips
      - name: Verify release checksums
        working-directory: dist_zips
        run: sha256sum --check SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_TAG: ${{ inputs.npm_tag }}
        run: |
          version="$(tr -d '\r\n' < node/VERSION)"
          prerelease_flag=()
          if [[ "$version" == *-* || "$NPM_TAG" != "latest" ]]; then prerelease_flag=(--prerelease --latest=false); fi
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "Release v${version} already exists; increment node/VERSION instead of replacing binaries."
            exit 1
          fi
          # Creating the ref atomically rejects an occupied tag, including tags without releases.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/v${version}" -f "sha=${GITHUB_SHA}" >/dev/null
          gh release create "v${version}" dist_zips/* \
            --verify-tag \
            --target "${GITHUB_SHA}" \
            --title "v${version}" \
            --notes-file node/WHATS_NEW.md \
            "${prerelease_flag[@]}"

  publish-npm:
    name: Publish npm package
    if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.publish_npm
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: artifacts
      - name: Publish npm package
        env:
          DESKGAP_AP_NPM_TAG: ${{ inputs.npm_tag }}
          DESKGAP_NPM_TARBALL: ${{ github.workspace }}/artifacts/npm.tgz
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash node/scripts/publish-release.sh

  verify-published:
    name: Verify published package (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.publish_npm
    needs: publish-npm
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: windows-2022
            platform: win32-x64
          - os: macos-15-intel
            platform: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Linux runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libsecret-1-0 xvfb
      - name: Verify published npm package
        if: runner.os != 'Linux'
        shell: bash
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
          DESKGAP_NPM_TEST_INSTALL_WHAT: deskgap@${{ inputs.npm_tag }}
          DESKGAP_NPM_TEST_VERSION_FILE: ${{ github.workspace }}/node/VERSION
        run: |
          version=$(<node/VERSION)
          for attempt in {1..12}; do
            published=$(npm view "deskgap@$NPM_TAG" version 2>/dev/null || true)
            if [[ "$published" == "$version" ]]; then break; fi
            if [[ "$attempt" == 12 ]]; then echo "npm tag did not resolve to $version"; exit 1; fi
            sleep 10
          done
          bash node/scripts/test-npm.sh
      - name: Verify published npm package on Xvfb
        if: runner.os == 'Linux'
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
          DESKGAP_NPM_TEST_INSTALL_WHAT: deskgap@${{ inputs.npm_tag }}
          DESKGAP_NPM_TEST_VERSION_FILE: ${{ github.workspace }}/node/VERSION
        run: |
          version=$(<node/VERSION)
          for attempt in {1..12}; do
            published=$(npm view "deskgap@$NPM_TAG" version 2>/dev/null || true)
            if [[ "$published" == "$version" ]]; then break; fi
            if [[ "$attempt" == 12 ]]; then echo "npm tag did not resolve to $version"; exit 1; fi
            sleep 10
          done
          xvfb-run --auto-servernum bash node/scripts/test-npm.sh
