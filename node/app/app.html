<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>DeskGap API Demo</title>
    <link rel="stylesheet" href="app.css" />
</head>
<body>
    <header data-deskgap-drag>
        <div>
            <span class="eyebrow">DESKGAP SAMPLE APP</span>
            <h1>Electron parity verification</h1>
            <p>Runs the portable compatibility surface through the real renderer-to-main transport.</p>
        </div>
        <button id="run-tests" data-deskgap-no-drag>Run again</button>
    </header>
    <main class="parity-main">
        <section class="summary" aria-live="polite">
            <div>
                <span class="summary-label">Status</span>
                <strong id="status">Running</strong>
            </div>
            <div>
                <span class="summary-label">Passed</span>
                <strong id="passed">0</strong>
            </div>
            <div>
                <span class="summary-label">Failed</span>
                <strong id="failed">0</strong>
            </div>
            <div>
                <span class="summary-label">Platform</span>
                <strong id="platform">-</strong>
            </div>
        </section>

        <section class="results-section">
            <div class="section-heading">
                <h2>Automated smoke tests</h2>
                <span id="last-run"></span>
            </div>
            <div id="test-results" class="test-results"></div>
        </section>

        <section class="native-actions">
            <div class="section-heading">
                <h2>Native window checks</h2>
                <span>Confirm each transition visually</span>
            </div>
            <div class="action-bar">
                <button data-window-method="minimize">Minimize</button>
                <button data-window-method="maximize">Maximize</button>
                <button data-window-method="unmaximize">Unmaximize</button>
                <button data-window-method="restore">Restore</button>
                <button data-window-method="setFullScreen" data-window-args="[true]">Enter fullscreen</button>
                <button data-window-method="setFullScreen" data-window-args="[false]">Leave fullscreen</button>
                <button data-window-method="flashFrame" data-window-args="[true]">Flash frame</button>
                <button data-window-method="flashFrame" data-window-args="[false]">Stop flashing</button>
            </div>
            <p id="action-result" class="action-result" aria-live="polite"></p>
        </section>
    </main>

    <script type="text/javascript">
    (function() {
        var runButton = document.getElementById('run-tests');
        var results = document.getElementById('test-results');
        var status = document.getElementById('status');

        function renderDetails(details) {
            if (details == null) return '';
            return '<pre>' + escapeHtml(JSON.stringify(details, null, 2)) + '</pre>';
        }

        function escapeHtml(value) {
            return value.replace(/[&<>"']/g, function(character) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[character];
            });
        }

        function runTests() {
            runButton.disabled = true;
            status.textContent = 'Running';
            status.className = 'running';
            results.innerHTML = '<p class="empty-state">Executing checks...</p>';

            deskgap.invoke('parity.run').then(function(report) {
                document.getElementById('passed').textContent = report.passed;
                document.getElementById('failed').textContent = report.failed;
                document.getElementById('platform').textContent = report.platform;
                document.getElementById('last-run').textContent = new Date().toLocaleTimeString();
                status.textContent = report.failed === 0 ? 'All passed' : 'Failures found';
                status.className = report.failed === 0 ? 'passed' : 'failed';
                results.innerHTML = report.tests.map(function(test) {
                    var details = test.status === 'passed' ? renderDetails(test.details) : '<pre>' + escapeHtml(test.error) + '</pre>';
                    return '<article class="test-row ' + test.status + '">' +
                        '<span class="indicator" aria-hidden="true"></span>' +
                        '<div><h3>' + escapeHtml(test.name) + '</h3>' + details + '</div>' +
                        '<span class="duration">' + test.durationMs + ' ms</span>' +
                    '</article>';
                }).join('');
            }).catch(function(error) {
                status.textContent = 'Transport failed';
                status.className = 'failed';
                results.innerHTML = '<pre class="fatal-error">' + escapeHtml(error.message || String(error)) + '</pre>';
            }).then(function() {
                runButton.disabled = false;
            });
        }

        Array.prototype.forEach.call(document.querySelectorAll('[data-window-method]'), function(button) {
            button.addEventListener('click', function() {
                var method = button.getAttribute('data-window-method');
                var args = JSON.parse(button.getAttribute('data-window-args') || '[]');
                deskgap.invoke('demo.window', { method: method, args: args }).then(function() {
                    document.getElementById('action-result').textContent = method + ' completed';
                }).catch(function(error) {
                    document.getElementById('action-result').textContent = method + ': ' + error.message;
                });
            });
        });

        runButton.addEventListener('click', runTests);
        runTests();
    })();
    </script>
